                  actual = {r['filename']: r['digests']['sha256'] for r in records}
                  if actual == expected:
                      print('SDK available from PyPI with the reviewed release hashes.')
                      break
                  if any(name not in expected or expected[name] != digest for name, digest in actual.items()):
                      raise SystemExit('PyPI distribution hash mismatch')
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      raise
              if attempt == 11:
                  raise SystemExit('PyPI SDK readback did not reach the reviewed files')
              time.sleep(5)
