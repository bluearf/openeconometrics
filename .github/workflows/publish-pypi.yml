              return records
          expected = {os.environ[k]: os.environ[k + '_SHA256'] for k in ('WHEEL', 'SDIST')}
          if {p.name for p in Path('dist').iterdir()} != set(expected):
              raise SystemExit('Unexpected distribution files')
          for name, digest in expected.items():
              if hashlib.sha256((Path('dist') / name).read_bytes()).hexdigest() != digest:
