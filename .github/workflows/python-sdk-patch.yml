name: Verify Python SDK patch

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-sdk-patch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Verify SDK patch package (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Select provisioned Chrome with its sandbox enabled
        run: |
          browser_path="$(command -v google-chrome || command -v google-chrome-stable)"
          test -n "$browser_path"
          "$browser_path" --version
          printf 'OPENECON_BROWSER_EXECUTABLE=%s\n' "$browser_path" >> "$GITHUB_ENV"
      - name: Build the local public SDK and charts patches
        run: |
          python -m pip install 'build==1.3.0' 'twine==7.0.0'
          python -m build packages/openecon-charts --outdir dist
          python -m build --outdir dist
          python -m twine check --strict dist/*
      - name: Install and verify dependency-free charts wheel and sdist
        shell: bash
        run: |
          for mode in wheel sdist; do
            chart_python="$RUNNER_TEMP/charts-$mode/bin/python"
            python -m venv "$RUNNER_TEMP/charts-$mode"
            if [ "$mode" = wheel ]; then
              "$chart_python" -m pip install dist/openecon_charts-0.3.0a2-py3-none-any.whl
            else
              "$chart_python" -m pip install dist/openecon_charts-0.3.0a2.tar.gz
            fi
            "$chart_python" -m pip check
            python scripts/verify_charts_distribution.py --python "$chart_python" --output "$RUNNER_TEMP/charts-$mode-smoke.json"
          done
      - name: Install and test fresh wheel and sdist environments
        shell: bash
        run: |
          for mode in wheel sdist; do
            package_python="$RUNNER_TEMP/sdk-$mode/bin/python"
            python -m venv "$RUNNER_TEMP/sdk-$mode"
            "$package_python" -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6,<3'
            if [ "$mode" = wheel ]; then
              "$package_python" -m pip install dist/openecon_charts-0.3.0a2-py3-none-any.whl dist/openecon-0.3.18a3-py3-none-any.whl
            else
              "$package_python" -m pip install dist/openecon_charts-0.3.0a2.tar.gz dist/openecon-0.3.18a3.tar.gz
            fi
            "$package_python" -m pip check
            "$package_python" scripts/generate_capability_docs.py --check
            python scripts/verify_sdk_distribution.py --python "$package_python" --output "$RUNNER_TEMP/sdk-$mode-smoke.json"
          done
      - name: Run bounded parser and OLS guard regressions
        run: |
          python -m pip install 'pytest>=8,<10' 'statsmodels>=0.14.4,<0.15'
          "$RUNNER_TEMP/sdk-wheel/bin/python" -m pip install 'pytest>=8,<10' 'statsmodels>=0.14.4,<0.15'
          "$RUNNER_TEMP/sdk-wheel/bin/python" -m pytest tests/test_dataset.py tests/test_streaming_ols_engine.py
      - name: Verify real sandboxed Chrome exports and owned profile cleanup
        run: |
          "$RUNNER_TEMP/sdk-wheel/bin/python" -c 'from openecon_charts.network_export import _browser; print(_browser(None))'
          "$RUNNER_TEMP/sdk-wheel/bin/python" -m pytest packages/openecon-charts/tests/test_network_export.py --junitxml="$RUNNER_TEMP/network-export.xml"
          python -c 'from pathlib import Path; import os; import xml.etree.ElementTree as ET; root = ET.parse(Path(os.environ["RUNNER_TEMP"]) / "network-export.xml").getroot(); assert not root.findall(".//skipped"), "Real browser export acceptance cannot be skipped"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sdk-patch-package-${{ matrix.python }}
          path: |
            dist/*
            ${{ runner.temp }}/sdk-*-smoke.json
            ${{ runner.temp }}/charts-*-smoke.json
            ${{ runner.temp }}/network-export.xml
          if-no-files-found: warn
          retention-days: 7
