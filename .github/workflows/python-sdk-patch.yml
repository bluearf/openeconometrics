name: Verify Python SDK patch

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-sdk-patch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Verify SDK patch package (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build the local public SDK patch
        run: |
          python -m pip install 'build==1.3.0' 'twine==7.0.0'
          python -m build --outdir dist
          python -m twine check --strict dist/*
      - name: Download unchanged reviewed charts wheel
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          import urllib.request
          name = 'openecon_charts-0.3.0a1-py3-none-any.whl'
          url = 'https://github.com/bluearf/openeconometrics/releases/download/v0.3.43-alpha.1/' + name
          with urllib.request.urlopen(url, timeout=60) as response:
              data = response.read()
          if hashlib.sha256(data).hexdigest() != '47384306e8136b8783afe01ef57e376b4fb1b86888eeafed0eb175b557f4386a':
              raise SystemExit('Reviewed charts wheel SHA256 mismatch')
          Path('dist', name).write_bytes(data)
      - name: Install and test fresh wheel and sdist environments
        shell: bash
        run: |
          for mode in wheel sdist; do
            package_python="$RUNNER_TEMP/sdk-$mode/bin/python"
            python -m venv "$RUNNER_TEMP/sdk-$mode"
            "$package_python" -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.6,<3'
            if [ "$mode" = wheel ]; then
              "$package_python" -m pip install dist/openecon_charts-0.3.0a1-py3-none-any.whl dist/openecon-0.3.18a3-py3-none-any.whl
            else
              "$package_python" -m pip install dist/openecon_charts-0.3.0a1-py3-none-any.whl dist/openecon-0.3.18a3.tar.gz
            fi
            "$package_python" -m pip check
            "$package_python" scripts/generate_capability_docs.py --check
            python scripts/verify_sdk_distribution.py --python "$package_python" --output "$RUNNER_TEMP/sdk-$mode-smoke.json"
          done
      - name: Run bounded parser and OLS guard regressions
        run: |
          python -m pip install 'pytest>=8,<10' 'statsmodels>=0.14.4,<0.15'
          "$RUNNER_TEMP/sdk-wheel/bin/python" -m pip install 'pytest>=8,<10' 'statsmodels>=0.14.4,<0.15'
          "$RUNNER_TEMP/sdk-wheel/bin/python" -m pytest tests/test_dataset.py tests/test_streaming_ols_engine.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sdk-patch-package-${{ matrix.python }}
          path: |
            dist/openecon-0.3.18a3*
            ${{ runner.temp }}/sdk-*-smoke.json
          if-no-files-found: warn
          retention-days: 7
