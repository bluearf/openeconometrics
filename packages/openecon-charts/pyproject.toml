[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "openecon-charts"
version = "0.3.0a2"
description = "Portable offline charts for Python tables and statistical models"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "OpenEconometrics contributors"}]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/openecon_charts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
