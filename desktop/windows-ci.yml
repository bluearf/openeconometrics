# Copy into .github/workflows/openecon-desktop.yml to enable the Windows runner.
name: OpenEconometrics Windows desktop
on:
  workflow_dispatch:
jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: 'x64'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build CPU runtime and installer
        shell: pwsh
        run: ./desktop/scripts/build_windows.ps1
      - name: Exercise bundled Python and spawned console worker
        shell: pwsh
        run: |
          $Executable = Resolve-Path ./desktop/src-tauri/target/release/openecon-desktop.exe
          $Output = Join-Path $env:RUNNER_TEMP 'openecon-smoke.json'
          $Errors = Join-Path $env:RUNNER_TEMP 'openecon-smoke.stderr'
          $Process = Start-Process -FilePath $Executable -ArgumentList '--smoke-test' -Wait -PassThru -RedirectStandardOutput $Output -RedirectStandardError $Errors
          if ($Process.ExitCode -ne 0) { Get-Content $Errors; throw 'Bundled runtime smoke test failed.' }
          $Result = Get-Content $Output -Raw | ConvertFrom-Json
          if ($Result.status -ne 'ok' -or -not $Result.bundled -or -not $Result.stable_origin) { throw 'Bundled runtime verification failed.' }
          Write-Output "Bundled CPU runtime verified; first startup $($Result.ready_seconds) s, repeat startup $($Result.warm_ready_seconds) s."
      - uses: actions/upload-artifact@v4
        with:
          name: OpenEconometrics-Windows-x64-unsigned
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
