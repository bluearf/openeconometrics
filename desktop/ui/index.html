<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenEconometrics</title>
<style>
  @font-face{font-family:Barlow;src:url('./Barlow.woff2') format('woff2');font-style:normal;font-weight:100 900;font-display:swap}
  :root{font-family:Barlow,system-ui,-apple-system,sans-serif;color:#203249;background:#fff}
  body{margin:0;min-height:100vh;display:grid;place-items:center}
  main{text-align:center;padding:32px;max-width:520px}
  h1{font-size:38px;letter-spacing:-1.3px;margin:0 0 16px;font-weight:650}
  p{color:#667487;font-size:15px;line-height:1.6;margin:12px 0}
  #loader{width:24px;height:24px;border:2px solid #e5eaf0;border-top-color:#203249;border-radius:50%;margin:24px auto;animation:spin .8s linear infinite}
  #loader[hidden]{display:none}@keyframes spin{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){#loader{animation:none}}
</style>
<body><main><h1>OpenEconometrics</h1><p id="status" role="status">Preparing your workspace.</p><div id="loader" aria-hidden="true"></div></main></body>
</html>
